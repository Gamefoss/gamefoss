name: Validate

on:
  pull_request:
    branches: [release/latest, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          DEPLOY_ENV: production
          PUBLIC_SITE_URL: https://gamefoss.com.br
          PUBLIC_BASE_PATH: /
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      - run: npm run validate:links
      - uses: actions/upload-artifact@v4
        with:
          name: gamefoss-preview
          path: dist/
          if-no-files-found: error

