name: Validate

on:
  pull_request:
    branches: [release/latest, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run check
        env:
          YOUTUBE_DATA_API: ${{ secrets.YOUTUBE_DATA_API }}
      - run: npm run build
        env:
          DEPLOY_ENV: production
          PUBLIC_SITE_URL: https://gamefoss.com.br
          PUBLIC_BASE_PATH: /
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          YOUTUBE_DATA_API: ${{ secrets.YOUTUBE_DATA_API }}
      - run: npm run validate:links
      - uses: actions/upload-artifact@v4
        with:
          name: gamefoss-preview
          path: dist/
          if-no-files-found: error
